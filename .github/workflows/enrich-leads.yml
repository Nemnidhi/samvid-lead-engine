name: Enrich leads

# Runs unattended every 15 minutes against the live database, processing
# whatever's newly imported with status "new" (a no-op query if there's
# nothing to do). GOOGLE_PLACES_API_KEY is live in repo secrets;
# META_AD_LIBRARY_ACCESS_TOKEN is still blocked on Meta App Review, so
# meta_ads checks will keep coming back checked:false until that lands.
# workflow_dispatch is kept for on-demand runs (e.g. a larger manual batch,
# or the --regoogle backfill mode) alongside the schedule.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of un-enriched leads to process"
        required: false
        default: "10"

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/enrich-leads.js "${{ github.event.inputs.batch_size }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          META_AD_LIBRARY_ACCESS_TOKEN: ${{ secrets.META_AD_LIBRARY_ACCESS_TOKEN }}
