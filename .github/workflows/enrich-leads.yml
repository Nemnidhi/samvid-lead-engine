name: Enrich leads

# Manual trigger only for now. Once GOOGLE_PLACES_API_KEY and
# META_AD_LIBRARY_ACCESS_TOKEN are set as repo secrets and the pipeline has
# been reviewed end-to-end, add a `schedule:` trigger here (e.g. every 15
# minutes) to run this unattended against the live database.
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of un-enriched leads to process"
        required: false
        default: "10"

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/enrich-leads.js "${{ github.event.inputs.batch_size }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          META_AD_LIBRARY_ACCESS_TOKEN: ${{ secrets.META_AD_LIBRARY_ACCESS_TOKEN }}
